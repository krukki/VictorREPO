<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Suap2 — Tarefas{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            background: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1f2430;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 640px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }

        a {
            color: #3b5bdb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #3b5bdb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2f4ac0;
            text-decoration: none;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #1f2430;
        }

        .btn-secondary:hover {
            background: #dde1e6;
            text-decoration: none;
        }

        .btn-danger {
            background: #fff0f0;
            color: #c92a2a;
        }

        .btn-danger:hover {
            background: #ffe3e3;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 13px;
        }

        form {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
