{% comment %}Mensagens do framework de messages, uma cor e um orbe por tipo (success, info, warning, error).{% endcomment %}
{% if messages %}
    <ul class="mensagens" aria-live="polite">
        {% for message in messages %}
            <li class="mensagem mensagem-{{ message.level_tag|default:'info' }}">
                <svg class="mensagem-icone" aria-hidden="true"><use href="#i-msg-{{ message.level_tag|default:'info' }}"></use></svg>
                <span class="mensagem-texto">{{ message }}</span>
            </li>
        {% endfor %}
    </ul>
{% endif %}
