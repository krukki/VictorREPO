{% extends 'Suap2APP/base.html' %}

{% block title %}{{ titulo_pagina }} — Suap2{% endblock %}

{% block content %}
    <h1>{{ titulo_pagina }}</h1>

    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Essa ação não pode ser desfeita.</p>

    {% if aviso %}
        <p class="aviso">{{ aviso }}</p>
    {% endif %}

    <form method="post" class="botoes">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Excluir</button>
        <a class="btn btn-secondary" href="{{ cancelar_url }}">Cancelar</a>
    </form>
{% endblock %}
