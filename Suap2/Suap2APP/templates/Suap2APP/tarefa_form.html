{% extends 'Suap2APP/base.html' %}

{% block title %}{{ titulo_pagina }} — Suap2{% endblock %}

{% block content %}
    <h1>{{ titulo_pagina }}</h1>

    <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px;">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #c92a2a; font-size: 13px; margin-top: 4px;">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-secondary" href="{% url 'tarefa_list' %}">Cancelar</a>
        </div>
    </form>

    <style>
        input[type="text"], input[type="datetime-local"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
{% endblock %}
